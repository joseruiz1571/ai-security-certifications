# AI Security Certifications — source of truth
# Edit this file, then run `bun run generate`. Never hand-edit README.md.
# Categories: offensive | defensive | governance | management-systems | vendor-ai
# Rule: every url must have been fetched live before entry. last_verified = date of that fetch.

- id: tryhackme-ai1
  name: TryHackMe AI Security Certification (AI1)
  org: TryHackMe
  category: offensive
  focus: Hands-on attack and defense of real AI systems across threat modeling, prompt injection and jailbreaking, AI supply chain security, and RAG data poisoning.
  format: 48-hour non-proctored browser-based practical exam; 4 sections, 13 hands-on scenarios; 70% to pass
  level: Entry
  cost_usd: null
  prerequisites: Basic security background (networking, OS, core security concepts); no prior AI/ML experience needed
  url: https://help.tryhackme.com/en/articles/15301082-ai1-exam-guide
  status: available
  launched: 2026-05
  last_verified: "2026-07-08"
  notes: Cert valid 3 years; prep is the AI Security learning path (5 modules, 25 rooms, included with Premium). Official cert page rate-limited during verification, so help-center exam guide cited.

- id: secops-c-ai-mlpen
  name: Certified AI/ML Pentester (C-AI/MLPen)
  org: The SecOps Group
  category: offensive
  focus: Practical LLM/AI exploitation including direct and indirect prompt injection, RAG poisoning, training data manipulation, and LLM design vulnerabilities.
  format: 4-hour hands-on practical exam (flag-based, VPN lab, on-demand, unproctored); 60% pass, 75% merit
  level: Intermediate
  cost_usd: 34
  prerequisites: ~1 year professional pentesting experience recommended; OWASP Top 10 for LLMs familiarity
  url: https://pentestingexams.com/certifications/professional/certified-ai-ml-pentester/
  status: available
  launched: 2024
  last_verified: "2026-07-08"
  notes: Heavily discounted at verification ($34 anniversary price, list $335); includes 1 free retake; exam-only model with no official training.

- id: offsec-osai
  name: OffSec AI Red Teamer (OSAI / OSAI+), course AI-300 Advanced AI Red Teaming
  org: OffSec (Offensive Security)
  category: offensive
  focus: Assessing and exploiting modern AI systems — generative AI, LLMs, ML pipelines, and multi-agent environments — from an attacker's perspective.
  format: 24-hour proctored hands-on red team engagement against a realistic AI-enabled enterprise environment; course + cert bundle
  level: Advanced
  cost_usd: 1749
  prerequisites: Strong cybersecurity foundation; pentesting experience; OSCP or equivalent recommended
